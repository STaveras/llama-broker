[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-broker"
version = "0.8.1.dev0"
description = "A profile-driven OpenAI-compatible broker for local inference runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Llama Broker contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
discovery = ["requests>=2.31"]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
brokerctl = "llama_broker.cli:main"
llama-broker = "llama_broker.daemon:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llama_broker = ["data/*.json", "data/*.service.in", "runtimes/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
