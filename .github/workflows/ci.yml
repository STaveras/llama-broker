name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate development snapshot version
        run: python tools/check_release.py --development
      - name: Check sanitized tree
        run: python tools/check_public_tree.py
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Install package without runtime dependencies
        run: |
          python -m pip install --no-deps .
          python -m pip install pytest
      - name: Run offline release suite
        run: python -m pytest -q --ignore=tests/test_local_production_manifest.py
      - name: Smoke installed console entry point
        run: |
          brokerctl --help
          python -c "import llama_broker; print(llama_broker.__name__)"
