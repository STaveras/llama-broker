name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sanitized public tree
        run: python tools/check_public_tree.py
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Generate checksums and release manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tomllib

          dist = pathlib.Path("dist")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          artifacts = {}
          for path in sorted(dist.iterdir()):
              if path.name == "release-manifest.json":
                  continue
              if path.is_file():
                  artifacts[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {
              "schema_version": 1,
              "version": project["project"]["version"],
              "tag": os.environ["RELEASE_VERSION"],
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "supported_python": ["3.11", "3.12", "3.13", "3.14"],
              "artifacts": artifacts,
          }
          (dist / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
